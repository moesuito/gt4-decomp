name: check

# What can be checked without the game: every source is real C/C++ (no assembly posing as C) and
# compiles with the original compiler. Matching itself needs your own executable: run
# `python tools/build.py` locally, which links everything and compares SHA-1 with the original.
# Sources live under src/<subsystem>/<unit>/ (tools/layout.py), new matches may still sit flat in src/.

on:
  push:
  pull_request:

jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime and extraction regression checks
        run: |
          python -m pip install rabbitizer
          python -m unittest discover -s tests -v
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No assembly posing as C
        run: find src -type f \( -name '*.c' -o -name '*.cpp' \) -print0 | xargs -0 python tools/asm_policy.py
      - name: Sources are where tools/layout.py puts them, with their real names
        run: python tools/organize.py --check
      - name: Compiler (ee-gcc 2.96, decomp.me build)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6:i386 binutils-mips-linux-gnu
          mkdir -p ~/.local/share/gt4/ee-gcc2.96
          curl -sL https://github.com/decompme/compilers/releases/download/compilers/ee-gcc2.96.tar.xz \
            | tar -xJ -C ~/.local/share/gt4/ee-gcc2.96
      - name: Other compilers named by sources (project.toml [compilers], decomp.me builds)
        run: |
          find src -type f \( -name '*.c' -o -name '*.cpp' \) > /tmp/sources.txt
          for name in $(xargs -a /tmp/sources.txt head -qn1 | sed -n 's|^/\* compiler: \([^ ]*\) \*/.*|\1|p' | sort -u); do
            url=$(python3 -c "import tomllib,sys; print(tomllib.load(open('project.toml','rb'))['compilers'][sys.argv[1]]['archive'])" "$name")
            mkdir -p ~/.local/share/gt4/compilers/"$name"
            curl -sL "$url" | tar -xJ -C ~/.local/share/gt4/compilers/"$name"
            echo "installed $name"
            # tools a profile needs besides its compiler (e.g. a later assembler), by name and archive
            python3 -c "import tomllib,sys; [print(k, v) for k, v in tomllib.load(open('project.toml','rb'))['compilers'][sys.argv[1]].get('needs', {}).items()]" "$name" |
              while read -r need url; do
                [ -d ~/.local/share/gt4/compilers/"$need" ] && continue
                mkdir -p ~/.local/share/gt4/compilers/"$need"
                curl -sL "$url" | tar -xJ -C ~/.local/share/gt4/compilers/"$need" && echo "installed $need (needed by $name)"
              done
          done
      - name: Every source compiles (with the compiler its first line names, else ee-gcc 2.96)
        # from the repository root, so -Iinclude (in every project.toml command) finds include/
        # (m2c_macros.h, types.h, the game headers include/gt4/); CPATH covers any command without it
        run: |
          export CPATH="$PWD/include"
          d=~/.local/share/gt4/ee-gcc2.96
          default="$d/bin/ee-gcc -c -B $d/bin/ee- -O2 -G0 -fno-exceptions -Iinclude"
          python3 - > /tmp/commands.txt <<'EOF'
          import tomllib, os
          for name, c in tomllib.load(open("project.toml", "rb")).get("compilers", {}).items():
              print(name, c["command"].replace("{dir}", os.path.expanduser(c["dir"])).replace("{tools}", os.path.abspath("tools")))
          EOF
          mkdir -p /tmp/obj
          fail=0
          n=0
          while read -r f; do
            name=$(head -n1 "$f" | sed -n 's|^/\* compiler: \([^ ]*\) \*/.*|\1|p')
            cmd="$default"
            if [ -n "$name" ]; then
              cmd=$(grep "^$name " /tmp/commands.txt | cut -d' ' -f2-)
              [ -n "$cmd" ] || { echo "::error file=$f::unknown compiler $name"; fail=1; continue; }
            fi
            n=$((n + 1))
            # eval: a command may quote its own arguments (wrappers such as cc_as.sh)
            eval "$cmd \"\$f\" -o /tmp/obj/$n.o" \
              || { echo "::error file=$f::does not compile"; fail=1; }
          done < /tmp/sources.txt
          echo "$(ls /tmp/obj | wc -l) sources compiled"
          exit $fail

      - name: Export compiled source objects for local binary proof
        run: |
          python -m pip install rabbitizer
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          import build, compiler_alignment, project
          out = pathlib.Path('/tmp/gt4-source-cache')
          out.mkdir()
          headers = hashlib.sha1()
          inc = pathlib.Path('include')
          for fp in sorted(inc.rglob('*')):
              if fp.is_file():
                  headers.update(fp.relative_to(inc).as_posix().encode() + b'\0' + fp.read_bytes())
          # Match the full builder's directory traversal, including its ordering.
          import os
          headers = hashlib.sha1()
          for directory, dirs, files in os.walk('include'):
              dirs.sort()
              for name in sorted(files):
                  fp = pathlib.Path(directory) / name
                  headers.update(fp.relative_to(inc).as_posix().encode() + b'\0' + fp.read_bytes())
          for index, source in enumerate(pathlib.Path('/tmp/sources.txt').read_text().splitlines(), 1):
              addr = project.source_address(source)
              if addr is None:
                  raise RuntimeError('Unresolved source: ' + source)
              raw = pathlib.Path('/tmp/obj') / (str(index) + '.o')
              profile = project.source_compiler(source)
              compiler_alignment.repair(pathlib.Path(source).resolve(), raw, project.compiler_command(profile))
              stem = pathlib.Path(source).stem
              objname = 'func_%08X' % addr
              subprocess.run(['mips-linux-gnu-objcopy', *build.STRIP.split(), '--wildcard', '-G', stem + '*', '-G', objname + '*', str(raw), str(out / (objname + '.o'))], check=True)
              digest = hashlib.sha1(pathlib.Path(source).read_bytes() + headers.digest()).hexdigest()
              rel = pathlib.Path(source).relative_to('src').as_posix()
              (out / (objname + '.src')).write_text('%s %s %s\n' % (rel, profile or 'default', digest))
          manifest = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'headers_sha1': headers.hexdigest(), 'objects': len(list(out.glob('*.o'))), 'note': 'Built from public sources only; original compiler flags and verified alignment retry; no game input.'}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(manifest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gt4-source-object-cache
          path: /tmp/gt4-source-cache
          retention-days: 3
          compression-level: 1
